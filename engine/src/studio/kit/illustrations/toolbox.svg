  <rect x="100" y="250" width="400" height="250" rx="22" style="fill:var(--kit-brand,#d9442f)"/>
  <rect x="100" y="250" width="400" height="250" rx="22" fill="url(#tb-box)"/>
  <rect x="100" y="250" width="400" height="70" rx="22" style="fill:var(--kit-brand,#d9442f)"/>
  <rect x="100" y="306" width="400" height="14" fill="#000" opacity=".18"/>
