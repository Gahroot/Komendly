    <linearGradient id="tb-steel" x1="0" x2="1"><stop offset="0" stop-color="#e9edf2"/><stop offset=".5" stop-color="#b9c1cc"/><stop offset="1" stop-color="#8b95a3"/></linearGradient>
  </defs>
  <ellipse cx="300" cy="520" rx="230" ry="24" fill="#000" opacity=".16"/>
  <path d="M220 250v-46c0-14 10-24 24-24h112c14 0 24 10 24 24v46h-26v-40H246v40z" fill="#3a3f4a"/>
