<!doctype html>
<!--
  Ozzy kit starter: LISTICLE. "3 reasons to ..." hook, three numbered beats (big number, icon, 2-5 words), then CTA. Snappy.
  Built for 9:16 (1080x1920).
  Copy it to ./index.html, then change ONLY:
    SIZE     2 places marked SIZE (meta viewport, #root data-width/data-height). 9:16 = 1080x1920.
    PALETTE  the :root block (each beat takes its tile colour from --c1/--c2/--c3).
    COPY     hook, each beat's .point (2-5 words) and .sub (optional, short), end card.
    IMAGES   one .media slot per beat (marked IMAGE). Icon: kit/icons/<name>.svg (grep ./kit/icons/INDEX.txt), keep "media illus".
             Photo: <div class="media"><img src="brand/photos/x.jpg"></div>.
    SCENES   seconds per scene in the SCENES array at the bottom; data-duration = their sum.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" /><!-- SIZE 1/2 -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  @font-face { font-family: "Unbounded"; src: url("kit/fonts/unbounded-normal.woff2") format("woff2"); font-weight: 200 900; }
  @font-face { font-family: "Host Grotesk"; src: url("kit/fonts/host-grotesk-normal.woff2") format("woff2"); font-weight: 300 800; }
  /* PALETTE: bg = backdrop, c1-c3 = beat colours, ink = text. */
  :root {
    --bg: #101425; --bg-2: #1d2547; --ink: #ffffff; --muted: #b5bdd8; --c1: #ffcf3f; --c2: #5ce1b0; --c3: #ff6b8b; --tile: #ffffff;
    --display: "Unbounded", sans-serif; --text: "Host Grotesk", system-ui, sans-serif;
  }
  html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--text); color: var(--ink);
    background: radial-gradient(80% 50% at 50% 40%, var(--bg-2) 0%, transparent 75%), var(--bg); }
  .grain { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.45)); }
  /* the colour wash that sweeps across between beats. NO CSS transform here: GSAP owns it. */
  .wipe { position: absolute; inset: 0; background: var(--c1); visibility: hidden; z-index: 5; }
  /* SAFE ZONE (9:16: top 8%, bottom 22%, right 12%) */
  .safe { position: absolute; left: 7%; right: 12%; top: 8%; bottom: 22%; display: grid; }
  .safe > .scene { grid-area: 1 / 1; visibility: hidden; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font: 700 2.8vmin/1.2 var(--text); letter-spacing: .16em; text-transform: uppercase; color: var(--c1); }
  .headline { font: 800 10vmin/1 var(--display); letter-spacing: -.04em; margin: 2vmin 0 0; }
  .headline .line { display: block; overflow: hidden; padding-bottom: .06em; }
  .headline .line > span { display: inline-block; }
  .headline em { font-style: normal; color: var(--c1); }
  .num { font: 900 46vmin/.8 var(--display); letter-spacing: -.06em; color: var(--c); text-shadow: 0 2vmin 5vmin rgba(0,0,0,.35); }
  .row { display: flex; align-items: center; gap: 4vmin; margin-top: 3vmin; }
  .tile { position: relative; flex: 0 0 auto; width: 22vmin; height: 22vmin; border-radius: 5vmin; overflow: hidden; background: var(--tile);
    box-shadow: 0 2vmin 5vmin rgba(0,0,0,.45), inset 0 0 0 .6vmin var(--c); rotate: -6deg; }
  .media { position: absolute; inset: 0; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media.illus { background: radial-gradient(60% 50% at 50% 50%, #fff 0%, transparent 85%), var(--tile); }
  .media.illus img { object-fit: contain; padding: 22%; box-sizing: border-box; }
  .point { font: 800 7.6vmin/1.02 var(--display); letter-spacing: -.035em; }
  .sub { font: 500 3.6vmin/1.3 var(--text); color: var(--muted); margin-top: 3vmin; max-width: 26ch; }
  .bar { height: 1.2vmin; width: 30vmin; border-radius: 99px; background: var(--c); margin-top: 3vmin; transform-origin: left center; }
  .cta { align-self: flex-start; margin-top: 4vmin; padding: 2.2vmin 4.4vmin; border-radius: 99px; background: var(--c1); color: var(--bg); font: 800 3.2vmin/1 var(--text); letter-spacing: .05em; text-transform: uppercase; box-shadow: 0 1.4vmin 3.4vmin rgba(0,0,0,.4); }
</style>
</head>
<body>
<!-- SIZE 2/2: data-width / data-height. data-duration = sum of SCENES. -->
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="12">
  <div class="grain"></div>
  <div class="safe">
    <!-- SCENE 1 HOOK -->
    <section class="scene">
      <div class="eyebrow">Brand name</div>
      <h1 class="headline"><span class="line"><span><em>3 reasons</em></span></span><span class="line"><span>to switch</span></span><span class="line"><span>this week.</span></span></h1>
    </section>
    <!-- SCENE 2 REASON 1 -->
    <section class="scene" style="--c: var(--c1)">
      <div class="num">1</div>
      <div class="row"><div class="tile"><div class="media illus"><img src="kit/icons/zap.svg" alt=""></div></div><!-- IMAGE 1 -->
        <div class="point">Done in a day.</div></div>
      <div class="bar"></div>
    </section>
    <!-- SCENE 3 REASON 2 -->
    <section class="scene" style="--c: var(--c2)">
      <div class="num">2</div>
      <div class="row"><div class="tile"><div class="media illus"><img src="kit/icons/badge-check.svg" alt=""></div></div><!-- IMAGE 2 -->
        <div class="point">Fixed fair price.</div></div>
      <div class="bar"></div>
    </section>
    <!-- SCENE 4 REASON 3 -->
    <section class="scene" style="--c: var(--c3)">
      <div class="num">3</div>
      <div class="row"><div class="tile"><div class="media illus"><img src="kit/icons/heart.svg" alt=""></div></div><!-- IMAGE 3 -->
        <div class="point">Locals love us.</div></div>
      <div class="bar"></div>
    </section>
    <!-- SCENE 5 END CARD -->
    <section class="scene">
      <div class="eyebrow">Ready?</div>
      <h1 class="headline"><span class="line"><span>Try Brand</span></span><span class="line"><span><em>today.</em></span></span></h1>
      <div class="cta">Book at brandname.com</div>
    </section>
  </div>
  <div class="wipe"></div>
</div>
<script>
  // SCENES: seconds per scene, in order (hook, 3 reasons, CTA).
  const SCENES = [2.4, 2.3, 2.3, 2.3, 2.7];
  const tl = gsap.timeline({ paused: true });
  const scenes = gsap.utils.toArray(".scene");
  const total = SCENES.reduce((a, b) => a + b, 0);
  const COLORS = ["--c1", "--c2", "--c3", "--c1"].map((v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim());
  let at = 0;
  scenes.forEach((s, i) => {
    const b = at + 0.12;
    if (i > 0) {
      // colour wipe sweeps up over the cut
      tl.set(".wipe", { visibility: "visible", backgroundColor: COLORS[i - 1], yPercent: 100 }, at - 0.28)
        .to(".wipe", { yPercent: 0, duration: 0.28, ease: "power3.in" }, at - 0.28)
        .set(scenes[i - 1], { visibility: "hidden" }, at)
        .to(".wipe", { yPercent: -100, duration: 0.32, ease: "power3.out" }, at)
        .set(".wipe", { visibility: "hidden" }, at + 0.32);
    }
    tl.set(s, { visibility: "visible" }, at);
    tl.from(s.querySelectorAll(".eyebrow"), { opacity: 0, y: 20, duration: 0.3, ease: "power3.out" }, b);
    tl.from(s.querySelectorAll(".line > span"), { yPercent: 110, duration: 0.55, ease: "expo.out", stagger: 0.07 }, b + 0.05);
    tl.from(s.querySelectorAll(".num"), { scale: 0.3, xPercent: -30, rotation: -12, opacity: 0, duration: 0.6, ease: "back.out(1.8)", transformOrigin: "left bottom" }, b);
    tl.from(s.querySelectorAll(".tile"), { scale: 0, rotation: -40, duration: 0.5, ease: "back.out(2.4)" }, b + 0.2);
    tl.from(s.querySelectorAll(".point"), { opacity: 0, x: 60, duration: 0.45, ease: "expo.out" }, b + 0.3);
    tl.from(s.querySelectorAll(".bar"), { scaleX: 0, duration: 0.5, ease: "power3.out" }, b + 0.45);
    tl.from(s.querySelectorAll(".cta"), { scale: 0.5, opacity: 0, duration: 0.5, ease: "back.out(2.4)", transformOrigin: "left center" }, b + 0.45);
    tl.to(s.querySelectorAll(".num"), { scale: 1.06, duration: SCENES[i] - 0.7, ease: "sine.inOut", transformOrigin: "left bottom" }, b + 0.6);
    at += SCENES[i];
  });
  tl.to({}, { duration: 0.01 }, total - 0.01);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
