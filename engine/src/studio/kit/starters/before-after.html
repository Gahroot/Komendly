<!doctype html>
<!--
  Ozzy kit starter: BEFORE-AFTER. Shows the problem, then a slider wipes from BEFORE to AFTER, then both side by side
  with the result, then the end card. For home services, cleaning, beauty, fitness, detailing, renovation.
  Copy it to ./index.html, then change ONLY:
    SIZE     2 places marked SIZE (meta viewport, #root data-width/data-height). 9:16=1080x1920, 1:1=1080x1080, 16:9=1920x1080.
    PALETTE  the :root block.
    COPY     text in each <section> and the BEFORE/AFTER labels.
    IMAGES   the .before and .after slots (marked IMAGE, they appear twice: reveal + split).
             Best: two real photos, <div class="media before"><img src="brand/photos/before.jpg"></div> and the same for after.
             Only one photo or a kit illustration? Use it in both slots: the "before" slot is greyed + dulled
             by CSS (class "dull") so the after still pops. Keep class "illus" for illustrations/icons.
    SCENES   seconds per scene in the SCENES array at the bottom; data-duration = their sum.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" /><!-- SIZE 1/2 -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  @font-face { font-family: "Archivo"; src: url("kit/fonts/archivo-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "Host Grotesk"; src: url("kit/fonts/host-grotesk-normal.woff2") format("woff2"); font-weight: 300 800; }
  /* PALETTE: field = background, ink = text, fresh = the "after" colour (labels, handle, result), dull = the "before" label. */
  :root {
    --field: #0f1d1a; --field-2: #173b33; --ink: #f2fbf7; --fresh: #3fe0a8; --dull: #8a8f8c; --paper: #ffffff;
    --display: "Archivo", "Arial Narrow", sans-serif; --text: "Host Grotesk", system-ui, sans-serif;
  }
  html, body { margin: 0; width: 100%; height: 100%; background: var(--field); }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--text); color: var(--ink);
    background: radial-gradient(90% 60% at 50% 60%, var(--field-2), var(--field)); }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  /* SAFE ZONE (9:16 feed UI: top 7%, bottom 22%, right 17%) */
  .safe { position: absolute; left: 7%; right: 7%; top: 7%; bottom: 20%; display: flex; flex-direction: column; }
  .eyebrow { font: 700 2.6vmin/1 var(--text); letter-spacing: .2em; text-transform: uppercase; color: var(--fresh); }
  .headline { font: 800 11vmin/.92 var(--display); font-stretch: 80%; text-transform: uppercase; letter-spacing: -.01em; margin: 1.6vmin 0 0; }
  .headline .line { display: block; overflow: hidden; padding-bottom: .04em; } .headline .line > span { display: inline-block; }
  .headline em { font-style: normal; color: var(--fresh); }
  .sub { font: 500 3.6vmin/1.3 var(--text); margin-top: 1.6vmin; opacity: .85; max-width: 30ch; }
  /* FRAME: the photo window, sized by the free space under the copy (container units) */
  .stage { position: relative; flex: 1; min-height: 0; margin-top: 4vmin; container-type: size; display: grid; place-items: center; }
  .frame { position: relative; width: min(100cqw, 80cqh, 90vmin); aspect-ratio: 4 / 5; border-radius: 3vmin; overflow: hidden;
    box-shadow: 0 3vmin 7vmin rgba(0,0,0,.5), inset 0 0 0 .4vmin rgba(255,255,255,.15); --p: 0%; }
  .media { position: absolute; inset: 0; background: #ddd; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media.illus { background: radial-gradient(70% 60% at 50% 55%, #ffffff, #cfe9df); }
  .media.illus img { object-fit: contain; padding: 14%; box-sizing: border-box; }
  .media.dull { filter: grayscale(.9) contrast(.75) brightness(.78) sepia(.25); }
  .media.dull::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, rgba(80,60,30,.25), transparent 40%), radial-gradient(circle at 70% 75%, rgba(60,50,30,.3), transparent 35%); }
  /* the reveal: .after is clipped to the left --p of the frame; the handle sits at --p */
  .reveal .after { clip-path: inset(0 calc(100% - var(--p)) 0 0); }
  .handle { position: absolute; top: 0; bottom: 0; left: var(--p); width: .8vmin; margin-left: -.4vmin; background: var(--paper); box-shadow: 0 0 3vmin rgba(0,0,0,.4); z-index: 3; }
  .handle::after { content: "‹ ›"; position: absolute; top: 50%; left: 50%; translate: -50% -50%; width: 9vmin; height: 9vmin; border-radius: 50%; background: var(--paper); color: var(--field);
    display: grid; place-items: center; font: 800 4vmin/1 var(--text); box-shadow: 0 1vmin 3vmin rgba(0,0,0,.35); }
  .label { position: absolute; top: 3vmin; z-index: 4; padding: 1.2vmin 2.4vmin; border-radius: 1.2vmin; font: 800 2.6vmin/1 var(--text); letter-spacing: .16em; text-transform: uppercase; }
  .label.b { left: 3vmin; background: rgba(0,0,0,.6); color: #fff; } .label.a { right: 3vmin; background: var(--fresh); color: var(--field); }
  /* SPLIT (scene 3): two frames, stacked in portrait, side by side otherwise */
  .split { flex: 1; min-height: 0; margin-top: 4vmin; display: grid; grid-template-rows: 1fr 1fr; gap: 2vmin; }
  .half { position: relative; border-radius: 3vmin; overflow: hidden; box-shadow: 0 2vmin 5vmin rgba(0,0,0,.45); }
  .result { position: absolute; z-index: 5; left: 50%; top: 50%; translate: -50% -50%; padding: 2vmin 4vmin; border-radius: 99px; background: var(--fresh); color: var(--field);
    font: 800 4vmin/1 var(--display); text-transform: uppercase; white-space: nowrap; box-shadow: 0 1.6vmin 4vmin rgba(0,0,0,.4); }
  /* END CARD */
  .end { justify-content: center; }
  .end .headline { font-size: 14vmin; }
  .checks { list-style: none; padding: 0; margin: 4vmin 0 0; display: grid; gap: 2vmin; font: 600 4vmin/1.2 var(--text); }
  .checks li::before { content: "✓"; display: inline-grid; place-items: center; width: 5.4vmin; height: 5.4vmin; margin-right: 2vmin; border-radius: 50%; background: var(--fresh); color: var(--field); font-weight: 900; font-size: 3vmin; vertical-align: .2vmin; }
  .cta { align-self: flex-start; margin-top: 5vmin; padding: 2.2vmin 4.6vmin; border-radius: 99px; background: var(--fresh); color: var(--field); font: 800 3.6vmin/1 var(--text); letter-spacing: .05em; text-transform: uppercase; box-shadow: 0 1.4vmin 4vmin rgba(0,0,0,.4); }
  .contact { font: 600 3vmin/1.2 var(--text); margin-top: 2.4vmin; opacity: .8; }
  /* No CSS transform here: GSAP owns it. */
  .wipe { position: absolute; inset: 0; z-index: 50; background: var(--fresh); }
  @media (min-aspect-ratio: 9/10) {
    .safe { top: 8%; bottom: 8%; left: 6%; right: 6%; display: grid; grid-template-columns: 42% 1fr; column-gap: 4%; align-items: center; }
    .safe > .copy { grid-column: 1; } .stage, .split { grid-column: 2; grid-row: 1; height: 100%; margin: 0; }
    .split { grid-template-rows: none; grid-template-columns: 1fr 1fr; }
    .end { display: flex; } .headline { font-size: 9vmin; }
  }
</style>
</head>
<body>
<!-- SIZE 2/2: data-width / data-height. data-duration = sum of SCENES. -->
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="14">

  <!-- SCENE 1 THE PROBLEM: the "before" only, slow push-in -->
  <section class="scene s1">
    <div class="safe">
      <div class="copy">
        <div class="eyebrow">Brand name · City</div>
        <h1 class="headline"><span class="line"><span>Does yours</span></span><span class="line"><span>look like this?</span></span></h1>
      </div>
      <div class="stage"><div class="frame">
        <div class="media before dull illus"><img src="kit/illustrations/house.svg" alt=""></div><!-- IMAGE before -->
        <span class="label b">Before</span>
      </div></div>
    </div>
  </section>

  <!-- SCENE 2 THE REVEAL: slider wipes before -> after -->
  <section class="scene s2 reveal">
    <div class="safe">
      <div class="copy">
        <div class="eyebrow">One visit later</div>
        <h1 class="headline"><span class="line"><span>Watch <em>this.</em></span></span></h1>
      </div>
      <div class="stage"><div class="frame">
        <div class="media before dull illus"><img src="kit/illustrations/house.svg" alt=""></div><!-- IMAGE before -->
        <div class="media after illus"><img src="kit/illustrations/house.svg" alt=""></div><!-- IMAGE after -->
        <div class="handle"></div>
        <span class="label b">Before</span><span class="label a">After</span>
      </div></div>
    </div>
  </section>

  <!-- SCENE 3 SIDE BY SIDE + the result in numbers -->
  <section class="scene s3">
    <div class="safe">
      <div class="copy">
        <div class="eyebrow">The result</div>
        <h1 class="headline"><span class="line"><span>Like <em>new</em> again.</span></span></h1>
      </div>
      <div class="split">
        <div class="half"><div class="media before dull illus"><img src="kit/illustrations/house.svg" alt=""></div><span class="label b">Before</span></div><!-- IMAGE before -->
        <div class="half"><div class="media after illus"><img src="kit/illustrations/house.svg" alt=""></div><span class="label a">After</span></div><!-- IMAGE after -->
        <div class="result">Done in 3 hours</div>
      </div>
    </div>
  </section>

  <!-- SCENE 4 END CARD -->
  <section class="scene s4">
    <div class="wipe"></div>
    <div class="safe end">
      <div class="copy">
        <div class="eyebrow">Brand name</div>
        <h1 class="headline"><span class="line"><span>Your turn.</span></span></h1>
        <ul class="checks"><li>Free quote in 24 h</li><li>Satisfaction guaranteed</li><li>Locally owned</li></ul>
        <div class="cta">Book online</div>
        <div class="contact">brandname.com · (555) 010-2030</div>
      </div>
    </div>
  </section>
</div>
<script>
  // SCENES: seconds per scene, in order. The reveal (scene 2) needs >= 3.5 s.
  const SCENES = [3.0, 4.2, 3.4, 3.4];
  const tl = gsap.timeline({ paused: true });
  const scenes = gsap.utils.toArray(".scene");
  let at = 0;
  scenes.forEach((s, i) => {
    const d = SCENES[i];
    tl.set(s, { visibility: "visible", zIndex: i + 1 }, at);
    const wipe = s.querySelector(".wipe");
    if (wipe) tl.fromTo(wipe, { yPercent: 101 }, { yPercent: -101, duration: 0.9, ease: "power3.inOut" }, at - 0.45);
    if (i > 0) tl.set(scenes[i - 1], { visibility: "hidden" }, at + (wipe ? 0.05 : 0));
    const b = at + (wipe ? 0.35 : 0.15);
    tl.from(s.querySelectorAll(".eyebrow"), { opacity: 0, y: 20, duration: 0.4, ease: "power3.out" }, b);
    tl.from(s.querySelectorAll(".line > span"), { yPercent: 110, duration: 0.6, ease: "expo.out", stagger: 0.08 }, b + 0.08);
    tl.from(s.querySelectorAll(".checks li"), { opacity: 0, x: -40, duration: 0.4, ease: "power3.out", stagger: 0.15 }, b + 0.5);
    tl.from(s.querySelectorAll(".cta"), { scale: 0.6, opacity: 0, duration: 0.5, ease: "back.out(2.2)", transformOrigin: "left center" }, b + 1.0);
    tl.from(s.querySelectorAll(".contact"), { opacity: 0, duration: 0.4 }, b + 1.2);
    at += d;
  });
  const t2 = SCENES[0], t3 = t2 + SCENES[1];
  // scene 1: frame drops in, slow push-in on the "before"
  tl.from(".s1 .frame", { y: 140, scale: 0.9, opacity: 0, duration: 0.8, ease: "expo.out" }, 0.25);
  tl.fromTo(".s1 .media img", { scale: 1 }, { scale: 1.12, duration: SCENES[0], ease: "none" }, 0);
  tl.from(".s1 .label", { opacity: 0, x: -20, duration: 0.3 }, 0.8);
  // scene 2: handle sweeps to 65%, eases back to 45% (the "tease"), then all the way
  const frame2 = document.querySelector(".s2 .frame");
  tl.set(frame2, { "--p": "0%" }, 0);
  tl.to(frame2, { "--p": "65%", duration: 1.1, ease: "power3.inOut" }, t2 + 0.5);
  tl.to(frame2, { "--p": "45%", duration: 0.6, ease: "sine.inOut" }, t2 + 1.7);
  tl.to(frame2, { "--p": "100%", duration: 0.9, ease: "power3.inOut" }, t2 + 2.4);
  tl.to(".s2 .handle", { opacity: 0, duration: 0.2 }, t2 + 3.2);
  tl.to(".s2 .label.b", { opacity: 0, duration: 0.2 }, t2 + 3.0);
  tl.from(".s2 .label.a", { opacity: 0, duration: 0.3 }, t2 + 0.9);
  tl.fromTo(".s2 .after img", { scale: 1.08 }, { scale: 1, duration: SCENES[1], ease: "power1.out" }, t2);
  // scene 3: halves slide in from opposite sides, result pill pops between them
  tl.from(".s3 .half:nth-child(1)", { xPercent: -30, opacity: 0, duration: 0.6, ease: "expo.out" }, t3 + 0.2);
  tl.from(".s3 .half:nth-child(2)", { xPercent: 30, opacity: 0, duration: 0.6, ease: "expo.out" }, t3 + 0.35);
  tl.from(".s3 .result", { scale: 0, duration: 0.5, ease: "back.out(2.4)" }, t3 + 0.9);
  tl.to(".s3 .result", { scale: 1.06, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, t3 + 1.5);
  tl.to({}, { duration: 0.01 }, at - 0.01);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
