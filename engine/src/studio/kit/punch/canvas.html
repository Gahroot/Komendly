<!doctype html>
<!-- Blank Ozzy canvas: brand palette, fonts, a living background and kit/punch.js are wired; the video is yours to plan.
     Any kind of video: an ad, a story, an explainer, a celebration, a lyric or quote piece, a footage edit, a title sequence.
     Add scenes (<div class="scene">) and beats in build(). Every helper: see the top of kit/punch.js. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=__W__, height=__H__" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="kit/punch.js"></script>
<style>
  @font-face { font-family: "Fraunces"; src: url("kit/fonts/fraunces-normal.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: "Fraunces"; src: url("kit/fonts/fraunces-italic.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
  @font-face { font-family: "Bricolage Grotesque"; src: url("kit/fonts/bricolage-grotesque-normal.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Host Grotesk"; src: url("kit/fonts/host-grotesk-normal.woff2") format("woff2"); font-weight: 300 800; }
  :root { --ink: #10131c; --ink-2: #1b2030; --paper: #f6f1e7; --accent: #ff6b35; --accent-2: #2bb3a3; --muted: #8a90a0;
    --display: "Bricolage Grotesque", sans-serif; --serif: "Fraunces", serif; --text: "Host Grotesk", sans-serif; }
  html, body { margin: 0; width: __W__px; height: __H__px; background: var(--ink); overflow: hidden; }
  #root { position: relative; width: __W__px; height: __H__px; overflow: hidden; font-family: var(--text); color: var(--paper);
    background: radial-gradient(80% 50% at 50% 0%, #1f4250 0%, transparent 70%), radial-gradient(80% 45% at 50% 100%, #3a2018 0%, transparent 70%), var(--ink); }
  .layer, .scene { position: absolute; inset: 0; }
  .scene { visibility: hidden; opacity: 0; }
  #s1 { visibility: visible; opacity: 1; }
  #grain { z-index: 60; opacity: .07; mix-blend-mode: overlay; pointer-events: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  /* Type: .ln = one centred line (P.fit keeps it inside the frame); .d heavy display, .i italic serif accent. */
  .ln { position: absolute; left: __PADX__px; width: __INNERW__px; text-align: center; white-space: nowrap; line-height: 1; }
  .ln > .t { display: inline-block; position: relative; transform-origin: 50% 60%; line-height: 1.02; padding: 0 .04em; }
  .d { font-family: var(--display); font-weight: 800; letter-spacing: -.035em; }
  .i { font-family: var(--serif); font-style: italic; font-weight: 500; color: var(--accent); letter-spacing: -.02em; }
  .mono { font: 700 __LABEL__px/1 var(--text); letter-spacing: .16em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="__W__" data-height="__H__" data-duration="10">
  <div id="bg" class="layer"></div>

  <!-- PLACEHOLDER: replace with this video's first scene. -->
  <div id="s1" class="scene">
    <div class="ln" id="h1" style="top:__TOP1__px"><span class="t d" style="font-size:__BIG__px">Your first</span></div>
    <div class="ln" id="h2" style="top:__TOP2__px"><span class="t i" style="font-size:__BIGGER__px">line here.</span></div>
  </div>

  <div id="grain" class="layer"></div>
</div>
<script>
(function () {
  function build() {
    const tl = gsap.timeline({ paused: true });
    const P = Punch(tl, { seed: 7 });
    P.fit(".ln > .t");
    P.stars("#bg", { n: 40, until: 10, top: 0.7 });

    // PLACEHOLDER beats: replace with this video's plan (something new starts every 0.5-1 s).
    P.slam("#h1 .t", 0.0, { from: 1.4 });
    P.slam("#h2 .t", 0.2, { from: 1.8, r0: -4 });
    P.drift("#h2 .t", 0.6, 9.4);
    // Scene change: const m = P.pixelWipe("#root", 3, { seed: 5 }); P.hide("#s1", m); P.show("#s2", m);

    tl.set({}, {}, 10);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  }
  Promise.all(["800 100px 'Bricolage Grotesque'", "italic 500 100px Fraunces", "500 100px Fraunces", "600 40px 'Host Grotesk'"].map((f) => document.fonts.load(f)))
    .then(() => document.fonts.ready).then(build);
})();
</script>
</body>
</html>
